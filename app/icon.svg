<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Fundal rotunjit -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Linie accent sus -->
  <rect x="80" y="72" width="352" height="5" rx="3" fill="url(#accent)"/>

  <!-- "AI" alb bold -->
  <text
    x="256" y="310"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="220"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="-8">AI</text>

  <!-- "CRAIOVA" alb mic -->
  <text
    x="256" y="390"
    font-family="Arial, sans-serif"
    font-weight="700"
    font-size="54"
    text-anchor="middle"
    fill="#ffffff"
    opacity="0.75"
    letter-spacing="14">CRAIOVA</text>

  <!-- Linie accent jos -->
  <rect x="80" y="420" width="352" height="5" rx="3" fill="url(#accent)"/>
</svg>
