<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#020812"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffec6e"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="256" fill="url(#glowBlue)"/>

  <!-- Outer ring gradient -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.8"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#ringGrad)" stroke-width="0.8" opacity="0.3"/>

  <!-- Neural network background nodes & lines -->
  <g clip-path="url(#circle)" opacity="0.18" stroke="#00c6ff" stroke-width="0.8" fill="none">
    <!-- Lines -->
    <line x1="80" y1="120" x2="180" y2="200"/>
    <line x1="180" y1="200" x2="256" y2="160"/>
    <line x1="256" y1="160" x2="340" y2="200"/>
    <line x1="340" y1="200" x2="430" y2="120"/>
    <line x1="180" y1="200" x2="150" y2="310"/>
    <line x1="150" y1="310" x2="256" y2="350"/>
    <line x1="256" y1="350" x2="360" y2="310"/>
    <line x1="360" y1="310" x2="340" y2="200"/>
    <line x1="256" y1="160" x2="256" y2="350"/>
    <line x1="80" y1="390" x2="150" y2="310"/>
    <line x1="430" y1="390" x2="360" y2="310"/>
    <line x1="150" y1="310" x2="120" y2="420"/>
    <line x1="360" y1="310" x2="390" y2="420"/>
    <line x1="80" y1="120" x2="100" y2="60"/>
    <line x1="430" y1="120" x2="410" y2="60"/>
  </g>
  <!-- Dots for neural nodes -->
  <g clip-path="url(#circle)" opacity="0.25" fill="#00c6ff">
    <circle cx="80" cy="120" r="4"/>
    <circle cx="180" cy="200" r="4"/>
    <circle cx="256" cy="160" r="5"/>
    <circle cx="340" cy="200" r="4"/>
    <circle cx="430" cy="120" r="4"/>
    <circle cx="150" cy="310" r="4"/>
    <circle cx="256" cy="350" r="5"/>
    <circle cx="360" cy="310" r="4"/>
    <circle cx="80" cy="390" r="3"/>
    <circle cx="430" cy="390" r="3"/>
  </g>

  <!-- Romanian flag accent strip (top arc) -->
  <path d="M 136 52 A 220 220 0 0 1 205 30" stroke="#002ea6" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 205 30 A 220 220 0 0 1 307 30" stroke="#fcd116" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 307 30 A 220 220 0 0 1 376 52" stroke="#ce1126" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- Central glow -->
  <ellipse cx="256" cy="230" rx="130" ry="80" fill="#00c6ff" opacity="0.04"/>

  <!-- Main "AI" text -->
  <text x="256" y="270"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="165"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#glow)"
    letter-spacing="-4">AI</text>

  <!-- Thin line separator -->
  <rect x="100" y="292" width="312" height="2" rx="1" fill="url(#ringGrad)" opacity="0.7"/>

  <!-- "CRAIOVA" text -->
  <text x="256" y="358"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-weight="700"
    font-size="52"
    text-anchor="middle"
    fill="url(#subGrad)"
    filter="url(#softGlow)"
    letter-spacing="12">CRAIOVA</text>

  <!-- Small dot accents -->
  <circle cx="256" cy="400" r="3" fill="#00e5ff" opacity="0.7"/>
  <circle cx="236" cy="400" r="2" fill="#7c3aed" opacity="0.5"/>
  <circle cx="276" cy="400" r="2" fill="#7c3aed" opacity="0.5"/>

  <!-- Corner micro-circuits (decorative) -->
  <g filter="url(#softGlow)" opacity="0.4" stroke="#00e5ff" stroke-width="1.5" fill="none">
    <polyline points="60,80 60,60 80,60"/>
    <circle cx="68" cy="68" r="3" fill="#00e5ff" stroke="none"/>
    <polyline points="452,80 452,60 432,60"/>
    <circle cx="444" cy="68" r="3" fill="#00e5ff" stroke="none"/>
    <polyline points="60,432 60,452 80,452"/>
    <circle cx="68" cy="444" r="3" fill="#00e5ff" stroke="none"/>
    <polyline points="452,432 452,452 432,452"/>
    <circle cx="444" cy="444" r="3" fill="#00e5ff" stroke="none"/>
  </g>

  <!-- Final outer glow ring -->
  <circle cx="256" cy="256" r="252" fill="none" stroke="#00c6ff" stroke-width="1" opacity="0.15"/>
</svg>
